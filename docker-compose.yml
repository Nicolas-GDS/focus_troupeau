# Environnement de développement (chapitre 6.5).
# Démarrage : docker compose up -d ; puis docker compose exec app php artisan migrate --seed

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: focustroupeau/app:dev
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  app:
    <<: *app

  queue-worker:
    <<: *app
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_DATABASE:-focustroupeau}
      POSTGRES_USER: ${DB_USERNAME:-focustroupeau}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-focustroupeau}
    ports:
      - "${DB_FORWARD_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-focustroupeau} -d ${DB_DATABASE:-focustroupeau}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    image: focustroupeau/python:dev
    volumes:
      - .:/var/www/html
    command: sleep infinity
    restart: unless-stopped

  # Outillage de développement (hors chapitre 6.5) : capture des e-mails (liens de connexion, codes 2FA)
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
    restart: unless-stopped

  # Compilation des ressources front (Vite / Tailwind)
  node:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5174}:5173"
    command: sh -c "npm install && npm run dev -- --host"
    profiles: ["front"]

volumes:
  pgdata:
  redisdata:
