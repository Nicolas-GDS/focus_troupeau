; Pool PHP-FPM (ENF-PERF-01, T-42) : la valeur par défaut (5 processus) fait attendre les requêtes dès une dizaine
; d'utilisateurs simultanés. 20 processus d'environ 60 Mo couvrent 50 éleveurs en consultation ; à ajuster à la
; mémoire du serveur de production (pm.max_children ≈ mémoire disponible pour PHP ÷ 64 Mo).
[www]
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
pm.max_requests = 500
