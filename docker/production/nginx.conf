# Serveur web de production (chapitre 6.5) : derrière le proxy TLS de l'hébergeur (ou Let's Encrypt sur l'hôte),
# qui transmet X-Forwarded-Proto ; Laravel fait confiance au proxy (TRUSTED_PROXIES) pour HTTPS et HSTS.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 22M;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Ressources compilées (nom versionné par Vite) : cache long ; en-têtes des fichiers statiques
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
