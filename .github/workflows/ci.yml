name: CI

on:
  push:
    branches: [main, 'lot*']
  pull_request:

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: focustroupeau_test
          POSTGRES_USER: focustroupeau
          POSTGRES_PASSWORD: focustroupeau
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U focustroupeau"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, intl, zip, bcmath, redis
          coverage: none

      - name: Extraction des bulletins LANO (pdftotext, Python 3)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan niveau 6)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests (Pest)
        run: php artisan test

  reference-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Implémentation de référence RC-5 à RC-14 (60 vérifications, T-10 à T-16)
        run: python3 calculs/test_calculs.py
